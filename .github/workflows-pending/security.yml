name: Security Audit

on:
  schedule:
    # Executa toda segunda-feira às 09:00 UTC
    - cron: '0 9 * * 1'
  push:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar cargo-audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (licenças e dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --all-features
          command: check
          command-arguments: ""
